kind = "mobile"
previewPath = "/mobile/"
title = "Wallet Witness Mobile"
description = "A mobile companion app for Wallet Witness — the blockchain investigation game. Players investigate anonymous wallets by unlocking clues one at a time, then submit a verdict on what type of wallet it is. Features a dark noir visual identity, case list, investigation board with clue unlocking, verdict submission, and a result screen. Connects to the shared API server and leaderboard."
version = "1.0.0"
id = "artifacts/mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 18115

[services.development]
run = "pnpm --filter @workspace/mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mobile", "run", "serve" ]

[services.env]
PORT = "18115"
BASE_PATH = "/mobile/"
